<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>狗了个狗 · 音频试听</title>
<link rel="icon" href="data:,">
<style>
  :root {
    color-scheme: light dark;
    --bg: #F4E7CC;
    --card: #FFFBF0;
    --edge: #E2B878;
    --line: #7A5A34;
    --ink: #3B2A17;
    --muted: #8A6F4E;
    --accent: #F2994A;
    --accent-ink: #FFFFFF;
    --on: #3E9B4F;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1E1913;
      --card: #2A231A;
      --edge: #5B4630;
      --line: #C9A26B;
      --ink: #F3E7D3;
      --muted: #B79D7A;
      --accent: #E0873B;
      --accent-ink: #1E1913;
      --on: #6CC47A;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 16px;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; }
  header { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
  h1 { margin: 0; font-size: 22px; }
  h2 { margin: 0 0 10px; font-size: 17px; }
  .badge {
    padding: 2px 10px;
    border: 2px solid var(--line);
    border-radius: 999px;
    background: var(--card);
    color: var(--muted);
    font-size: 13px;
  }
  .badge[data-on="1"] { color: var(--on); border-color: var(--on); }
  .card {
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 4px 0 var(--edge);
    padding: 14px;
    margin-bottom: 16px;
  }
  .row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 10px; }
  .row:last-child { margin-bottom: 0; }
  .muted { color: var(--muted); font-size: 13px; }
  button {
    font: inherit;
    font-weight: 700;
    color: var(--ink);
    background: var(--card);
    border: 2px solid var(--line);
    border-radius: 12px;
    box-shadow: 0 3px 0 var(--line);
    padding: 6px 14px;
    cursor: pointer;
    touch-action: manipulation;
  }
  button:active { transform: translateY(3px); box-shadow: 0 0 0 var(--line); }
  button.primary { background: var(--accent); color: var(--accent-ink); }
  button:disabled { opacity: 0.5; cursor: default; }
  label.check { display: inline-flex; align-items: center; gap: 6px; }
  input[type="range"] { flex: 1 1 160px; min-width: 0; accent-color: var(--accent); }
  select {
    font: inherit;
    color: var(--ink);
    background: var(--card);
    border: 2px solid var(--edge);
    border-radius: 8px;
    padding: 2px 4px;
    width: 100%;
  }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .sfx {
    display: flex;
    flex-direction: column;
    gap: 6px;
    border: 2px solid var(--edge);
    border-radius: 12px;
    padding: 10px;
    transition: border-color 0.15s;
  }
  .sfx.active { border-color: var(--accent); }
  .sfx code { font-size: 15px; font-weight: 700; }
  .sfx .scene { font-size: 13px; color: var(--muted); }
  .sfx button { margin-top: auto; }
  .num { font-variant-numeric: tabular-nums; min-width: 3em; }
  #fileHint { border-color: var(--accent); }
</style>
</head>
<body>
<main>
  <header>
    <h1>狗了个狗 · 音频试听</h1>
    <span id="status" class="badge">未解锁：点任意按钮即解锁</span>
  </header>

  <section id="fileHint" class="card" hidden>
    当前是直接用文件打开的，浏览器不允许加载模块。请在项目根目录运行 <code>node tools/serve.mjs</code>，
    再打开 <code>http://localhost:5301/tools/audio-preview.html</code>。
  </section>

  <section class="card">
    <h2>背景音乐《狗狗撒欢》</h2>
    <div class="row">
      <button id="music" class="primary" type="button">播放音乐</button>
      <label class="check"><input id="musicOn" type="checkbox" checked> 音乐开关</label>
      <label class="check"><input id="sfxOn" type="checkbox" checked> 音效开关</label>
    </div>
    <div class="row">
      <span>紧张度</span>
      <input id="tension" type="range" min="0" max="1" step="0.01" value="0" aria-label="紧张度">
      <span id="tensionVal" class="num">0.00</span>
    </div>
    <div class="row">
      <button type="button" data-t="0">0</button>
      <button type="button" data-t="0.5">0.5</button>
      <button type="button" data-t="1">1（卡槽快满）</button>
    </div>
    <p id="songInfo" class="muted"></p>
  </section>

  <section class="card">
    <h2>音效</h2>
    <div class="row">
      <button id="playAll" type="button">依次播放全部</button>
      <button id="comboRun" type="button">连消 1→7（听音高上升）</button>
    </div>
    <div id="sfx" class="grid"></div>
  </section>

  <p class="muted">
    说明：首次点击任意按钮会调用 <code>unlock()</code> 创建并恢复 AudioContext；之后每次点击仍会调用，重复调用没有副作用，
    还能在 iOS 来电等打断后把声音叫醒。切到其他标签页时音频会暂停，回来自动恢复。
  </p>
</main>

<script>
  // 直接用文件打开时模块加载不了，给出提示
  if (location.protocol === 'file:') document.getElementById('fileHint').hidden = false;
</script>
<script type="module">
  import { createAudio, SFX_NAMES, SONG } from '../src/audio/audio.js';

  const audio = createAudio();
  const $ = (sel) => document.querySelector(sel);
  const wait = (ms) => new Promise((r) => setTimeout(r, ms));

  // 首次点击任意按钮时解锁：捕获阶段先于按钮自己的处理函数执行，保证 play / startMusic 调用时已解锁
  let unlocked = false;
  document.addEventListener('click', (e) => {
    if (!e.target.closest('button')) return;
    audio.unlock();
    if (!unlocked) {
      unlocked = true;
      $('#status').textContent = '已解锁';
      $('#status').dataset.on = '1';
    }
  }, true);

  // ── 音乐 ──
  let playing = false;
  $('#music').addEventListener('click', () => {
    playing = !playing;
    if (playing) audio.startMusic();
    else audio.stopMusic();
    $('#music').textContent = playing ? '停止音乐' : '播放音乐';
  });
  $('#musicOn').addEventListener('change', (e) => audio.setMusic(e.target.checked));
  $('#sfxOn').addEventListener('change', (e) => audio.setSfx(e.target.checked));

  const slider = $('#tension');
  const applyTension = () => {
    const t = Number(slider.value);
    $('#tensionVal').textContent = t.toFixed(2);
    audio.setTension(t);
  };
  slider.addEventListener('input', applyTension);
  for (const b of document.querySelectorAll('button[data-t]')) {
    b.addEventListener('click', () => {
      slider.value = b.dataset.t;
      applyTension();
    });
  }

  $('#songInfo').textContent = `${SONG.bpm} BPM · ${SONG.bars} 小节 AABA 循环 · C 大调五声音阶 · 主旋律 ${SONG.lead.length} 音 · 贝斯 ${SONG.bass.length} 音 · 鼓 ${SONG.drums.length} 击`;

  // ── 音效 ──
  const INFO = {
    tap: ['点牌', '短促的「啵」'],
    place: ['入槽', '木头轻敲声'],
    match: ['三消', '三音上行琶音，combo 越高音越高'],
    woof: ['狗叫', '共振峰合成的狗叫'],
    moveOut: ['移出', '上扬的嗖声'],
    undo: ['撤回', '倒带声'],
    shuffle: ['洗牌', '洗牌沙沙声'],
    warn: ['卡槽将满', '心跳声'],
    deny: ['点到被压住的牌', '闷响'],
    win: ['通关', '号角 + 上行音阶 + 小狗欢叫'],
    lose: ['失败', '悲伤长号 + 呜咽'],
    revive: ['复活', '魔法闪光'],
    button: ['界面按钮', '很轻的点击声'],
  };
  // 依次播放时每个音效之后的等待（毫秒）
  const GAP = { match: 700, woof: 700, moveOut: 600, undo: 600, shuffle: 600, warn: 700, win: 1800, lose: 2800, revive: 1100 };

  const cards = {};
  const optsOf = {};
  for (const name of SFX_NAMES) {
    const card = document.createElement('div');
    card.className = 'sfx';
    const [scene, desc] = INFO[name] || ['', ''];
    card.innerHTML = `<code>${name}</code><span class="scene">${scene} · ${desc}</span>`;
    optsOf[name] = () => undefined;

    if (name === 'match') {
      const sel = document.createElement('select');
      sel.setAttribute('aria-label', 'combo');
      for (let c = 1; c <= 8; c++) sel.add(new Option(`combo ${c}（升 ${Math.min(12, 2 * (c - 1))} 半音）`, String(c)));
      card.append(sel);
      optsOf[name] = () => ({ combo: Number(sel.value) });
    }
    if (name === 'woof') {
      const sel = document.createElement('select');
      sel.setAttribute('aria-label', 'variant');
      [['0', '0 中型犬 350Hz'], ['1', '1 小型犬 600Hz'], ['2', '2 大型犬 200Hz 连叫两声']].forEach(([v, t]) => sel.add(new Option(t, v)));
      card.append(sel);
      optsOf[name] = () => ({ variant: Number(sel.value) });
    }

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.textContent = '播放';
    btn.addEventListener('click', () => audio.play(name, optsOf[name]()));
    card.append(btn);
    cards[name] = card;
    $('#sfx').append(card);
  }

  let busy = false;
  async function runSequence(steps) {
    if (busy) return;
    busy = true;
    $('#playAll').disabled = true;
    $('#comboRun').disabled = true;
    for (const [name, opts, gap] of steps) {
      cards[name].classList.add('active');
      audio.play(name, opts);
      await wait(gap);
      cards[name].classList.remove('active');
    }
    $('#playAll').disabled = false;
    $('#comboRun').disabled = false;
    busy = false;
  }
  $('#playAll').addEventListener('click', () => runSequence(SFX_NAMES.map((n) => [n, optsOf[n](), GAP[n] || 500])));
  $('#comboRun').addEventListener('click', () => runSequence([1, 2, 3, 4, 5, 6, 7].map((c) => ['match', { combo: c }, 520])));
</script>
</body>
</html>
